[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-ticket"
dynamic = ["version"]
description = "Ticket system for Alliance Auth: route requests to departments with Discord notifications."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yilifaer" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "allianceauth>=5.0,<6",
    "Pillow>=10",
    "requests",
]

[project.optional-dependencies]
test = ["freezegun", "polib", "coverage"]

[project.urls]
Homepage = "https://github.com/yilifaer/aa-ticket"
Source = "https://github.com/yilifaer/aa-ticket"
Changelog = "https://github.com/yilifaer/aa-ticket/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "aa_ticket.__version__" }

[tool.setuptools.packages.find]
include = ["aa_ticket*"]
exclude = ["aa_ticket.tests*"]

[tool.setuptools.package-data]
aa_ticket = [
    "templates/**/*",
    "static/**/*",
    "locale/**/*",
]
