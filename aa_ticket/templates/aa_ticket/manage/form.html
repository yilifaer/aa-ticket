{% extends "aa_ticket/manage/base.html" %}
{% load i18n %}

{% block manage_content %}
<h1 class="h4 mb-3">{{ title }}</h1>
<form method="post" class="aa-ticket-form" style="max-width: 48rem;">
    {% csrf_token %}
    {% include "aa_ticket/partials/form_fields.html" %}
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">{% translate "Save" context 'aa_ticket' %}</button>
        {% if list_url %}<a class="btn btn-secondary" href="{% url list_url %}">{% translate "Cancel" context 'aa_ticket' %}</a>{% endif %}
    </div>
</form>
{% endblock %}
