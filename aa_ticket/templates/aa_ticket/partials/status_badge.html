{% load i18n %}{% if ticket.status == "open" %}<span class="badge text-bg-warning"><i class="fas fa-hourglass-start" aria-hidden="true"></i> {{ ticket.get_status_display }}</span>{% elif ticket.status == "in_progress" %}<span class="badge text-bg-primary"><i class="fas fa-comments" aria-hidden="true"></i> {{ ticket.get_status_display }}</span>{% else %}<span class="badge text-bg-secondary"><i class="fas fa-circle-check" aria-hidden="true"></i> {{ ticket.get_status_display }}</span>{% endif %}
