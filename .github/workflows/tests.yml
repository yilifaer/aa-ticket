name: Tests

on:
  push:
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
        aa: ["5.0.*", "5.4.0"]
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - name: Install
        run: |
          pip install "allianceauth==${{ matrix.aa }}" "django-sri<1" httpx
          pip install -e ".[test]"
      - name: Test
        run: python runtests.py aa_ticket -v 2

  mariadb:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: aa_ticket
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - name: Install
        run: |
          pip install "allianceauth==5.4.0" "django-sri<1" httpx allianceauth-discordbot build
          pip install -e ".[test]"
          pip show allianceauth | grep "Version: 5.4.0"
      - name: Migrations match the models
        run: DJANGO_SETTINGS_MODULE=testauth.settings python -m django makemigrations aa_ticket --check --dry-run
      - name: Test
        env:
          AA_TICKET_TEST_DB: mysql
        run: python runtests.py aa_ticket -v 2
      - name: Package builds and contains templates, static files and translations, but no tests
        run: |
          python -m build
          unzip -l dist/*.whl > wheel.txt
          grep -q "aa_ticket/templates/aa_ticket/detail.html" wheel.txt
          grep -q "aa_ticket/static/aa_ticket/js/ticket.js" wheel.txt
          grep -q "aa_ticket/locale/zh_Hans/LC_MESSAGES/django.mo" wheel.txt
          grep -q "aa_ticket/migrations/0005_ticket_indexes.py" wheel.txt
          ! grep -q "aa_ticket/tests/" wheel.txt
          tar -tzf dist/*.tar.gz | grep -q "CHANGELOG.md"
